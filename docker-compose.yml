services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: monopoly-dynamodb
    ports:
      - "8002:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
