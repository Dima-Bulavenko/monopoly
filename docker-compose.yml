services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: monopoly-dynamodb
    ports:
      - "8002:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb"]
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
    depends_on:
      - dynamodb-local
  postgres:
    image: postgres:17-alpine
    container_name: monopoly-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: monopoly
      POSTGRES_PASSWORD: monopoly
      POSTGRES_DB: monopoly
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monopoly"]
      interval: 5s
      timeout: 3s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: monopoly-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin
volumes:
  dynamodb-data:
  postgres-data:
  pgadmin-data:
