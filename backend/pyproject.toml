[project]
name = "backend"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=13.0.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.1",
    "google-auth>=2.52.0",
    "mangum>=0.19.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.0",
    "pyjwt[crypto]>=2.12.1",
    "requests>=2.33.1",
    "sqlmodel>=0.0.38",
]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "coverage>=7.13.5",
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
    "scalene>=2.2.1",
    "ty>=0.0.32",
    "types-aioboto3[apigatewaymanagementapi,dynamodb]>=15.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
