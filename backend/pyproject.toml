[project]
name = "backend"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=13.0.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.1",
    "mangum>=0.19.0",
    "pwdlib[argon2]>=0.3.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "coverage>=7.13.5",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
    "scalene>=2.2.1",
    "ty>=0.0.32",
    "types-aioboto3[dynamodb]>=15.5.0",
]
